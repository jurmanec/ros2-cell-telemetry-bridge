apiVersion: 1

datasources:
  - name: Weld historian
    uid: weld-historian
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: p3
      defaultBucket: weld
    secureJsonData:
      token: p3-historian-dev-token
