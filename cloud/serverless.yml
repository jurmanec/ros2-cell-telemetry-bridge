service: p3-cell-telemetry

frameworkVersion: "3"

# Load cloud/.env into ${env:…} (SLS v3; otherwise only exported shell vars apply).
useDotenv: true

# SLS v3 schema omits python3.12; AWS accepts it. Local plugin extends the enum.
plugins:
  - ./plugins/aws-lambda-runtime-schema-patch.js

provider:
  name: aws
  runtime: python3.12
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 15
  architecture: arm64
  environment:
    SAMPLES_TABLE: ${self:service}-${sls:stage}-samples
    INGEST_API_KEY: ${env:INGEST_API_KEY, 'dev-local-change-me'}
    TEMP_C_THRESHOLD: ${env:TEMP_C_THRESHOLD, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:BatchWriteItem
          Resource:
            - Fn::GetAtt: [SamplesTable, Arn]

functions:
  ingest:
    handler: src/handler.handle_ingest
    description: Cell telemetry batch ingest (M3)
    events:
      - httpApi:
          path: /v1/telemetry/batch
          method: post

resources:
  Resources:
    SamplesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-samples
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE

  Outputs:
    IngestUrl:
      Description: POST telemetry batches here (include x-api-key header)
      Value:
        Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1/telemetry/batch
    SamplesTableName:
      Value:
        Ref: SamplesTable

package:
  patterns:
    - "!.venv/**"
    - "!tests/**"
    - "!**/__pycache__/**"
    - "!**/*.pyc"
    - "!node_modules/**"
    - "!.serverless/**"
    - "!package-lock.json"
    - "src/**"
    - "!README.md"
